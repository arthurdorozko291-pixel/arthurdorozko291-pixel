<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clownfish Aquarium — Interactive 3D</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: linear-gradient(180deg, #0a1628 0%, #1a3a5c 100%);
    font-family: "Segoe UI", system-ui, sans-serif;
  }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }
  #hint {
    position: fixed;
    left: 50%;
    bottom: 18px;
    transform: translateX(-50%);
    color: rgba(200, 225, 255, 0.75);
    font-size: 13px;
    letter-spacing: 0.06em;
    pointer-events: none;
    user-select: none;
    text-shadow: 0 1px 3px rgba(0,0,0,0.6);
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="app"></div>
<div id="hint">drag to orbit &nbsp;•&nbsp; scroll to zoom</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ============================================================
   Renderer / Scene / Camera
============================================================ */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.getElementById('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a1628);
scene.fog = new THREE.Fog(0x0d1f33, 16, 42);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(7.5, 4.6, 9.5);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
pmrem.dispose();

/* ============================================================
   Background: deep-ocean gradient + animated caustics
============================================================ */
const bgMaterial = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 } },
  fog: false,
  depthWrite: false,
  vertexShader: `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }`,
  fragmentShader: `
    varying vec2 vUv;
    uniform float uTime;
    float caustic(vec2 p, float t) {
      float v = 0.0;
      v += sin(p.x * 7.0 + t * 1.1) * sin(p.y * 6.0 - t * 0.8);
      v += sin((p.x * 0.7 + p.y) * 5.0 + t * 0.6) * sin(p.x * 4.0 - p.y * 5.0 - t * 0.9);
      v = v * 0.25 + 0.5;
      return pow(clamp(v, 0.0, 1.0), 8.0);
    }
    void main() {
      vec3 bottom = vec3(0.039, 0.086, 0.157);  // #0a1628
      vec3 top    = vec3(0.102, 0.227, 0.361);  // #1a3a5c
      vec3 col = mix(bottom, top, smoothstep(0.0, 1.0, vUv.y));
      float c = caustic(vUv * vec2(9.0, 6.0), uTime);
      col += vec3(0.35, 0.55, 0.78) * c * 0.12 * smoothstep(0.05, 0.7, vUv.y);
      gl_FragColor = vec4(col, 1.0);
    }`
});
const bg = new THREE.Mesh(new THREE.PlaneGeometry(140, 80), bgMaterial);
bg.position.set(0, 10, -18);
bg.renderOrder = -10;
bg.frustumCulled = false;
scene.add(bg);

/* ============================================================
   Lighting
============================================================ */
scene.add(new THREE.AmbientLight(0x0d47a1, 0.7));

function makeSpot(x, z) {
  const spot = new THREE.SpotLight(0xffffff, 160, 0, 0.6, 0.5, 1.2);
  spot.position.set(x, 7.6, z);
  const target = new THREE.Object3D();
  target.position.set(0, 1.2, 0);
  scene.add(target);
  spot.target = target;
  spot.castShadow = true;
  spot.shadow.mapSize.set(2048, 2048);
  spot.shadow.camera.near = 2;
  spot.shadow.camera.far = 16;
  spot.shadow.bias = -0.0004;
  scene.add(spot);
  return spot;
}
makeSpot(-2.6, 1.6);
makeSpot(2.6, -1.6);

/* ============================================================
   Glass aquarium: 5 panels (4 walls + bottom), open top
============================================================ */
const TANK = { w: 6, d: 4, h: 3, t: 0.08 };

const glassMat = new THREE.MeshPhysicalMaterial({
  color: 0xe0f7fa,
  metalness: 0,
  roughness: 0.05,
  transmission: 0.95,
  thickness: 0.15,
  ior: 1.5,
  transparent: true,
  opacity: 0.18,
  specularIntensity: 1.0,
  clearcoat: 1.0,
  clearcoatRoughness: 0.08,
  side: THREE.DoubleSide,
  envMapIntensity: 1.2,
  depthWrite: false
});

function glassPanel(sx, sy, sz, x, y, z) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(sx, sy, sz), glassMat);
  m.position.set(x, y, z);
  m.renderOrder = 5;
  scene.add(m);
  return m;
}
glassPanel(TANK.w, TANK.h, TANK.t, 0, TANK.h / 2,  TANK.d / 2);   // front
glassPanel(TANK.w, TANK.h, TANK.t, 0, TANK.h / 2, -TANK.d / 2);   // back
glassPanel(TANK.t, TANK.h, TANK.d,  TANK.w / 2, TANK.h / 2, 0);   // right
glassPanel(TANK.t, TANK.h, TANK.d, -TANK.w / 2, TANK.h / 2, 0);   // left
glassPanel(TANK.w, TANK.t, TANK.d, 0, TANK.t / 2, 0);             // bottom

/* top rim / frame (matte black) */
const frameMat = new THREE.MeshStandardMaterial({ color: 0x141414, roughness: 0.55, metalness: 0.25 });
function frameBar(sx, sy, sz, x, y, z) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(sx, sy, sz), frameMat);
  m.position.set(x, y, z);
  m.castShadow = true;
  m.receiveShadow = true;
  scene.add(m);
}
const rimY = TANK.h + 0.07;
frameBar(TANK.w + 0.28, 0.14, 0.18, 0, rimY,  TANK.d / 2);
frameBar(TANK.w + 0.28, 0.14, 0.18, 0, rimY, -TANK.d / 2);
frameBar(0.18, 0.14, TANK.d + 0.28,  TANK.w / 2, rimY, 0);
frameBar(0.18, 0.14, TANK.d + 0.28, -TANK.w / 2, rimY, 0);

/* floor beneath the tank */
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(80, 80),
  new THREE.MeshStandardMaterial({ color: 0x0b1c30, roughness: 1 })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.02;
floor.receiveShadow = true;
scene.add(floor);

/* ============================================================
   Water volume + animated rippled surface
============================================================ */
const WATER = { x: 2.9, z: 1.9, bottom: 0.15, top: 2.8 };

const waterMat = new THREE.MeshPhongMaterial({
  color: 0x1e88e5,
  transparent: true,
  opacity: 0.13,
  shininess: 90,
  specular: 0x88bbff,
  side: THREE.DoubleSide,
  depthWrite: false
});
const waterHeight = WATER.top - WATER.bottom;
const water = new THREE.Mesh(
  new THREE.BoxGeometry(WATER.x * 2, waterHeight, WATER.z * 2),
  waterMat
);
water.position.set(0, WATER.bottom + waterHeight / 2, 0);
water.renderOrder = 2;
scene.add(water);

const surfGeo = new THREE.PlaneGeometry(WATER.x * 2, WATER.z * 2, 36, 24);
surfGeo.rotateX(-Math.PI / 2);
const surfBase = surfGeo.attributes.position.array.slice();
const surfMat = new THREE.MeshPhongMaterial({
  color: 0x42a5f5,
  transparent: true,
  opacity: 0.38,
  shininess: 160,
  specular: 0xd6ecff,
  side: THREE.DoubleSide,
  depthWrite: false
});
const surface = new THREE.Mesh(surfGeo, surfMat);
surface.position.y = WATER.top;
surface.renderOrder = 3;
scene.add(surface);

function updateSurface(t) {
  const pos = surfGeo.attributes.position;
  const arr = pos.array;
  for (let i = 0; i < pos.count; i++) {
    const bx = surfBase[i * 3];
    const bz = surfBase[i * 3 + 2];
    arr[i * 3 + 1] =
      Math.sin(bx * 1.6 + t * 1.3) * 0.035 +
      Math.cos(bz * 2.1 + t * 0.8) * 0.030 +
      Math.sin((bx + bz) * 2.6 + t * 1.7) * 0.020;
  }
  pos.needsUpdate = true;
  surfGeo.computeVertexNormals();
}

/* ============================================================
   Sand bed (procedurally displaced)
============================================================ */
function sandNoise(x, z) {
  return (
    Math.sin(x * 1.9 + 1.7) * Math.cos(z * 2.3 + 0.4) * 0.070 +
    Math.sin(x * 4.7 + 0.3) * Math.sin(z * 3.9 + 2.1) * 0.035 +
    Math.cos((x + z) * 6.1 + 0.8) * 0.020
  );
}
const sandGeo = new THREE.PlaneGeometry(WATER.x * 2, WATER.z * 2, 56, 40);
sandGeo.rotateX(-Math.PI / 2);
{
  const p = sandGeo.attributes.position;
  for (let i = 0; i < p.count; i++) {
    p.array[i * 3 + 1] = sandNoise(p.array[i * 3], p.array[i * 3 + 2]);
  }
  sandGeo.computeVertexNormals();
}
const sand = new THREE.Mesh(
  sandGeo,
  new THREE.MeshStandardMaterial({ color: 0xd7ccc8, roughness: 1, metalness: 0 })
);
sand.position.y = 0.13;
sand.receiveShadow = true;
scene.add(sand);

/* ============================================================
   Stones
============================================================ */
const rockMat = new THREE.MeshStandardMaterial({
  color: 0x424242, roughness: 0.95, metalness: 0.05, flatShading: true
});
const rocks = [];
const rockDefs = [
  { x: -1.7, z: 0.7,  s: 0.50 },
  { x: 1.8,  z: -0.9, s: 0.62 },
  { x: 0.3,  z: 1.45, s: 0.38 },
  { x: -0.8, z: -1.5, s: 0.45 },
  { x: 2.45, z: 0.9,  s: 0.34 }
];
for (const r of rockDefs) {
  const g = new THREE.IcosahedronGeometry(r.s, 1);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const j = 1 + (Math.sin(i * 12.9898) * 43758.5453 % 1) * 0.18;
    p.setXYZ(i, p.getX(i) * j, p.getY(i) * j, p.getZ(i) * j);
  }
  g.computeVertexNormals();
  const m = new THREE.Mesh(g, rockMat);
  m.scale.set(1, 0.72, 1);
  m.position.set(r.x, 0.13 + r.s * 0.34, r.z);
  m.rotation.set(Math.random() * 3, Math.random() * 3, Math.random() * 3);
  m.castShadow = true;
  m.receiveShadow = true;
  scene.add(m);
  rocks.push({ x: r.x, z: r.z, r: r.s * 1.1 });
}

/* ============================================================
   Seaweed clusters (shader-swayed ribbons)
============================================================ */
const weedUniforms = [];
function makeWeedMaterial(color, h) {
  const mat = new THREE.MeshStandardMaterial({
    color, roughness: 0.6, metalness: 0, side: THREE.DoubleSide
  });
  const phase = Math.random() * Math.PI * 2;
  mat.onBeforeCompile = (shader) => {
    shader.uniforms.uTime = { value: 0 };
    shader.uniforms.uPhase = { value: phase };
    shader.uniforms.uH = { value: h };
    weedUniforms.push(shader.uniforms);
    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', '#include <common>\nuniform float uTime;\nuniform float uPhase;\nuniform float uH;')
      .replace('#include <begin_vertex>', `#include <begin_vertex>
        float kk = clamp(position.y / uH, 0.0, 1.0);
        transformed.x += sin(uTime * 1.5 + uPhase + kk * 5.0) * 0.30 * kk;
        transformed.z += cos(uTime * 1.15 + uPhase * 1.3 + kk * 4.0) * 0.18 * kk;`);
  };
  return mat;
}
function makeRibbon(h, w, color) {
  const g = new THREE.PlaneGeometry(w, h, 1, 12);
  g.translate(0, h / 2, 0);
  const m = new THREE.Mesh(g, makeWeedMaterial(color, h));
  m.castShadow = true;
  return m;
}
const weedColors = [0x2e7d32, 0x388e3c, 0x43a047];
const clusterDefs = [
  { x: -2.3, z: -1.3 }, { x: 2.2, z: 1.2 }, { x: -1.9, z: 1.5 }, { x: 2.35, z: -1.2 }
];
for (const c of clusterDefs) {
  const n = 5 + Math.floor(Math.random() * 2);
  for (let i = 0; i < n; i++) {
    const h = 0.8 + Math.random() * 0.9;
    const ribbon = makeRibbon(h, 0.16 + Math.random() * 0.1, weedColors[i % weedColors.length]);
    ribbon.position.set(
      c.x + (Math.random() - 0.5) * 0.5,
      0.14,
      c.z + (Math.random() - 0.5) * 0.5
    );
    ribbon.rotation.y = Math.random() * Math.PI * 2;
    scene.add(ribbon);
  }
}

/* ============================================================
   Bubbles (Points particle system)
============================================================ */
const BUBBLE_COUNT = 70;
const bubPos = new Float32Array(BUBBLE_COUNT * 3);
const bubBaseX = new Float32Array(BUBBLE_COUNT);
const bubZ = new Float32Array(BUBBLE_COUNT);
const bubY = new Float32Array(BUBBLE_COUNT);
const bubSpeed = new Float32Array(BUBBLE_COUNT);
const bubPhase = new Float32Array(BUBBLE_COUNT);
function resetBubble(i, initial) {
  bubBaseX[i] = (Math.random() * 2 - 1) * (WATER.x - 0.25);
  bubZ[i] = (Math.random() * 2 - 1) * (WATER.z - 0.25);
  bubY[i] = initial ? WATER.bottom + Math.random() * (WATER.top - WATER.bottom) : WATER.bottom + 0.05;
  bubSpeed[i] = 0.25 + Math.random() * 0.4;
  bubPhase[i] = Math.random() * Math.PI * 2;
}
for (let i = 0; i < BUBBLE_COUNT; i++) resetBubble(i, true);
const bubGeo = new THREE.BufferGeometry();
bubGeo.setAttribute('position', new THREE.BufferAttribute(bubPos, 3));

const bubbleCanvas = document.createElement('canvas');
bubbleCanvas.width = bubbleCanvas.height = 64;
{
  const ctx = bubbleCanvas.getContext('2d');
  const grad = ctx.createRadialGradient(32, 32, 2, 32, 32, 30);
  grad.addColorStop(0.0, 'rgba(255,255,255,0.95)');
  grad.addColorStop(0.4, 'rgba(255,255,255,0.35)');
  grad.addColorStop(1.0, 'rgba(255,255,255,0.0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 64, 64);
}
const bubMat = new THREE.PointsMaterial({
  size: 0.09,
  map: new THREE.CanvasTexture(bubbleCanvas),
  transparent: true,
  opacity: 0.45,
  color: 0xffffff,
  depthWrite: false,
  sizeAttenuation: true
});
const bubbles = new THREE.Points(bubGeo, bubMat);
bubbles.renderOrder = 4;
scene.add(bubbles);

function updateBubbles(t, dt) {
  for (let i = 0; i < BUBBLE_COUNT; i++) {
    bubY[i] += bubSpeed[i] * dt;
    if (bubY[i] > WATER.top - 0.03) resetBubble(i, false);
    bubPos[i * 3]     = bubBaseX[i] + Math.sin(t * 2.2 + bubPhase[i]) * 0.07;
    bubPos[i * 3 + 1] = bubY[i];
    bubPos[i * 3 + 2] = bubZ[i] + Math.cos(t * 1.7 + bubPhase[i]) * 0.05;
  }
  bubGeo.attributes.position.needsUpdate = true;
}

/* ============================================================
   Clownfish (procedural multi-part model)
============================================================ */
const finMat = new THREE.MeshStandardMaterial({
  color: 0xff8f00, transparent: true, opacity: 0.85,
  side: THREE.DoubleSide, roughness: 0.5, depthWrite: false
});
const eyeWhiteMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.15 });
const pupilMat = new THREE.MeshStandardMaterial({ color: 0x0a0a0a, roughness: 0.1 });
const glintMat = new THREE.MeshBasicMaterial({ color: 0xffffff });

function createClownfish() {
  const fish = new THREE.Group();

  /* body: orange with 3 white stripes bordered in black (shader) */
  const bodyMat = new THREE.MeshStandardMaterial({ color: 0xFF6D00, roughness: 0.45, metalness: 0.05 });
  bodyMat.onBeforeCompile = (shader) => {
    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', '#include <common>\nvarying float vOz;\nvarying float vOy;')
      .replace('#include <begin_vertex>', '#include <begin_vertex>\nvOz = position.z;\nvOy = position.y;');
    shader.fragmentShader = shader.fragmentShader
      .replace('#include <common>', '#include <common>\nvarying float vOz;\nvarying float vOy;')
      .replace('#include <color_fragment>', `#include <color_fragment>
      {
        float z = vOz;
        float w = 0.0;
        float b = 0.0;
        float d, ww, bb;
        d = abs(z - 0.60); ww = 1.0 - smoothstep(0.085, 0.105, d); bb = (1.0 - smoothstep(0.115, 0.140, d)) * (1.0 - ww); w = max(w, ww); b = max(b, bb);
        d = abs(z - 0.02); ww = 1.0 - smoothstep(0.100, 0.125, d); bb = (1.0 - smoothstep(0.135, 0.165, d)) * (1.0 - ww); w = max(w, ww); b = max(b, bb);
        d = abs(z + 0.82); ww = 1.0 - smoothstep(0.060, 0.080, d); bb = (1.0 - smoothstep(0.085, 0.110, d)) * (1.0 - ww); w = max(w, ww); b = max(b, bb);
        diffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.96, 0.98, 1.0), w);
        diffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.02, 0.02, 0.03), b);
        diffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.72, 0.24, 0.0), smoothstep(0.25, 0.95, vOy) * 0.55);
      }`);
  };
  const body = new THREE.Mesh(new THREE.SphereGeometry(1, 40, 28), bodyMat);
  body.scale.set(0.55, 0.62, 1.6);
  body.castShadow = true;
  fish.add(body);

  /* tail (caudal fin): forked fan, wagged around Y */
  const tailShape = new THREE.Shape();
  tailShape.moveTo(0, 0.12);
  tailShape.quadraticCurveTo(0.70, 0.45, 0.88, 0.78);
  tailShape.quadraticCurveTo(0.55, 0.40, 0.18, 0.0);
  tailShape.quadraticCurveTo(0.55, -0.40, 0.88, -0.78);
  tailShape.quadraticCurveTo(0.70, -0.45, 0, -0.12);
  tailShape.quadraticCurveTo(-0.70, -0.45, -0.88, -0.78);
  tailShape.quadraticCurveTo(-0.55, -0.40, -0.18, 0.0);
  tailShape.quadraticCurveTo(-0.55, 0.40, -0.88, 0.78);
  tailShape.quadraticCurveTo(-0.70, 0.45, 0, 0.12);
  const tailGeo = new THREE.ShapeGeometry(tailShape);
  tailGeo.translate(0, 0, -0.9);
  const tailGroup = new THREE.Group();
  tailGroup.position.set(0, 0.02, -1.4);
  const tail = new THREE.Mesh(tailGeo, finMat);
  tail.castShadow = true;
  tailGroup.add(tail);
  fish.add(tailGroup);

  /* dorsal fin (top sail, plane along body axis) */
  const dorsalShape = new THREE.Shape();
  dorsalShape.moveTo(-0.8, 0.0);
  dorsalShape.quadraticCurveTo(0.0, 0.15, 0.9, 0.05);
  dorsalShape.quadraticCurveTo(0.6, 0.75, -0.1, 0.62);
  dorsalShape.quadraticCurveTo(-0.5, 0.5, -0.8, 0.0);
  const dorsalGeo = new THREE.ShapeGeometry(dorsalShape);
  dorsalGeo.rotateY(Math.PI / 2);
  const dorsal = new THREE.Mesh(dorsalGeo, finMat);
  dorsal.position.set(0, 0.32, 0);
  dorsal.castShadow = true;
  fish.add(dorsal);

  /* anal fin (underside near tail) */
  const analShape = new THREE.Shape();
  analShape.moveTo(-0.5, 0.0);
  analShape.quadraticCurveTo(0.2, -0.10, 0.7, -0.02);
  analShape.quadraticCurveTo(0.3, -0.42, -0.2, -0.36);
  analShape.quadraticCurveTo(-0.4, -0.2, -0.5, 0.0);
  const analGeo = new THREE.ShapeGeometry(analShape);
  analGeo.rotateY(Math.PI / 2);
  const anal = new THREE.Mesh(analGeo, finMat);
  anal.position.set(0, -0.36, -0.5);
  anal.castShadow = true;
  fish.add(anal);

  /* pectoral fins (x2), flapping */
  const pecShape = new THREE.Shape();
  pecShape.moveTo(0, 0.12);
  pecShape.quadraticCurveTo(0.50, 0.25, 0.62, -0.05);
  pecShape.quadraticCurveTo(0.45, -0.30, 0, -0.18);
  pecShape.quadraticCurveTo(-0.05, -0.05, 0, 0.12);
  const pecGeo = new THREE.ShapeGeometry(pecShape);
  const pecR = new THREE.Group();
  pecR.position.set(0.35, -0.02, 0.55);
  pecR.rotation.y = -0.35;
  const pecRMesh = new THREE.Mesh(pecGeo, finMat);
  pecRMesh.castShadow = true;
  pecR.add(pecRMesh);
  fish.add(pecR);
  const pecL = new THREE.Group();
  pecL.position.set(-0.35, -0.02, 0.55);
  pecL.rotation.y = 0.35;
  const pecLMesh = new THREE.Mesh(pecGeo, finMat);
  pecLMesh.scale.x = -1;
  pecLMesh.castShadow = true;
  pecL.add(pecLMesh);
  fish.add(pecL);

  /* eyes: white sphere + black pupil + specular glint */
  for (const side of [-1, 1]) {
    const white = new THREE.Mesh(new THREE.SphereGeometry(0.13, 16, 12), eyeWhiteMat);
    white.position.set(side * 0.40, 0.18, 0.95);
    const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.07, 16, 12), pupilMat);
    pupil.position.set(side * 0.47, 0.18, 1.00);
    const glint = new THREE.Mesh(new THREE.SphereGeometry(0.028, 8, 8), glintMat);
    glint.position.set(side * 0.50, 0.24, 1.045);
    fish.add(white, pupil, glint);
  }

  return { group: fish, body, tailGroup, dorsal, anal, pecL, pecR };
}

/* ============================================================
   Fish AI: random waypoints inside the water, rock avoidance
============================================================ */
const BOUNDS = { minX: -2.0, maxX: 2.0, minZ: -0.95, maxZ: 0.95, minY: 0.55, maxY: 2.45 };
const rand = (a, b) => a + Math.random() * (b - a);

function randomWaypoint() {
  for (let i = 0; i < 25; i++) {
    const p = new THREE.Vector3(
      rand(BOUNDS.minX + 0.15, BOUNDS.maxX - 0.15),
      rand(BOUNDS.minY + 0.1, BOUNDS.maxY - 0.1),
      rand(BOUNDS.minZ + 0.15, BOUNDS.maxZ - 0.15)
    );
    let clear = true;
    for (const r of rocks) {
      const dx = p.x - r.x, dz = p.z - r.z;
      if (dx * dx + dz * dz < (r.r + 0.8) * (r.r + 0.8)) { clear = false; break; }
    }
    if (clear) return p;
  }
  return new THREE.Vector3(0, 1.5, 0);
}

function dampAngle(current, target, lambda, dt) {
  let d = (target - current) % (Math.PI * 2);
  if (d > Math.PI) d -= Math.PI * 2;
  if (d < -Math.PI) d += Math.PI * 2;
  return current + d * (1 - Math.exp(-lambda * dt));
}

const fishes = [];
const fishScales = [0.38, 0.33, 0.36];
for (let i = 0; i < 3; i++) {
  const parts = createClownfish();
  const s = fishScales[i];
  parts.group.scale.setScalar(s);
  const wp = randomWaypoint();
  parts.group.position.copy(wp);
  fishes.push({
    ...parts,
    wp,
    yaw: rand(0, Math.PI * 2),
    pitch: 0,
    speed: 0.45 + Math.random() * 0.3,
    phase: rand(0, Math.PI * 2)
  });
  scene.add(parts.group);
}

function updateFish(f, t, dt) {
  const pos = f.group.position;
  const dir = new THREE.Vector3().subVectors(f.wp, pos);
  const dist = dir.length();
  if (dist < 0.3) {
    f.wp = randomWaypoint();
    dir.subVectors(f.wp, pos);
  }
  dir.normalize();
  const desiredYaw = Math.atan2(dir.x, dir.z);
  const desiredPitch = -Math.atan2(dir.y, Math.hypot(dir.x, dir.z)) * 0.6;
  f.yaw = dampAngle(f.yaw, desiredYaw, 4, dt);
  f.pitch += (desiredPitch - f.pitch) * (1 - Math.exp(-3 * dt));

  pos.x += Math.sin(f.yaw) * f.speed * dt;
  pos.z += Math.cos(f.yaw) * f.speed * dt;
  pos.y += Math.sin(f.pitch) * f.speed * dt;

  /* rock avoidance: push out horizontally */
  for (const r of rocks) {
    const dx = pos.x - r.x, dz = pos.z - r.z;
    const d2 = dx * dx + dz * dz;
    const minD = r.r + 0.45;
    if (d2 < minD * minD && d2 > 1e-6) {
      const d = Math.sqrt(d2);
      pos.x = r.x + (dx / d) * minD;
      pos.z = r.z + (dz / d) * minD;
    }
  }

  /* keep inside the water volume */
  let clamped = false;
  if (pos.x < BOUNDS.minX) { pos.x = BOUNDS.minX; clamped = true; }
  if (pos.x > BOUNDS.maxX) { pos.x = BOUNDS.maxX; clamped = true; }
  if (pos.z < BOUNDS.minZ) { pos.z = BOUNDS.minZ; clamped = true; }
  if (pos.z > BOUNDS.maxZ) { pos.z = BOUNDS.maxZ; clamped = true; }
  if (pos.y < BOUNDS.minY) { pos.y = BOUNDS.minY; clamped = true; }
  if (pos.y > BOUNDS.maxY) { pos.y = BOUNDS.maxY; clamped = true; }
  if (clamped) f.wp = randomWaypoint();

  f.group.rotation.y = f.yaw;
  f.group.rotation.x = f.pitch;
  f.group.rotation.z = Math.sin(t * 2.6 + f.phase) * 0.04;

  /* wagging tail synced to speed (~±20°) */
  const wagFreq = 5 + f.speed * 8;
  const wagAmp = 0.22 + f.speed * 0.25;
  const wag = Math.sin(t * wagFreq + f.phase) * wagAmp;
  f.tailGroup.rotation.y = wag;
  f.body.rotation.y = -wag * 0.25;

  /* fin animations */
  f.dorsal.rotation.x = Math.sin(t * 2.2 + f.phase) * 0.08;
  f.anal.rotation.x = Math.sin(t * 2.5 + f.phase + 1.0) * 0.06;
  f.pecL.rotation.x = Math.sin(t * 6.5 + f.phase) * 0.5 - 0.15;
  f.pecR.rotation.x = Math.sin(t * 6.5 + f.phase + 0.7) * 0.5 - 0.15;
}

/* ============================================================
   Controls
============================================================ */
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.4, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 4.5;
controls.maxDistance = 15;
controls.minPolarAngle = 0.25;
controls.maxPolarAngle = 1.45;
controls.enablePan = false;
controls.update();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ============================================================
   Main loop
============================================================ */
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  bgMaterial.uniforms.uTime.value = t;
  for (const u of weedUniforms) u.uTime.value = t;
  updateSurface(t);
  updateBubbles(t, dt);
  for (const f of fishes) updateFish(f, t, dt);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
